# Publishes wiki/ to the repository's GitHub wiki (https://github.com/fenjo26/OpenGSC/wiki).
#
# wiki/ in this repository is the source of truth: pages are reviewed in pull requests like any
# other change, and every push to main that touches wiki/ mirrors the folder into the wiki's own
# git repository. Edits made in the GitHub wiki UI are overwritten by the next sync — change the
# files here instead.
#
# One-time setup: GitHub creates the wiki repository only after its first page exists. If the
# job fails with "Repository not found", open the Wiki tab, create any page once, then re-run
# this workflow (Actions → Publish wiki → Run workflow).
name: Publish wiki

on:
  push:
    branches: [main]
    paths: ["wiki/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mirror wiki/ into the GitHub wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "$RUNNER_TEMP/wiki"; then
            echo "::error::The wiki repository does not exist yet. Create any page in the Wiki tab once, then re-run this workflow."
            exit 1
          fi
          rsync -a --delete --exclude .git wiki/ "$RUNNER_TEMP/wiki/"
          cd "$RUNNER_TEMP/wiki"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki is already up to date."
            exit 0
          fi
          git commit -m "Sync wiki from ${GITHUB_SHA::7}"
          git push
